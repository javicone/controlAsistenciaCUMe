<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Conserjes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', path='css/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/conserjes.css') }}">
</head>
<body>
  <div class="header-bar">
    <h1>Panel de Conserjes — Estado de las Aulas</h1>
    <div class="header-bar-actions">
      <span id="ws-status" class="status-disconnected">🔴 Desconectado</span>
      <button class="button button-on" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </div>
  
  <div style="margin-bottom: 15px;">
    <button id="btn-actualizar" class="button button-on">🔄 Actualizar Lista</button>
  </div>
  
  <div id="panel">
    <p>Conectando...</p>
  </div>
  
  <script src="{{ url_for('static', path='js/conserjes.js') }}"></script>
</body>
</html>
