<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Conserjes — UEx</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/conserjes.css') }}">
</head>
<body>

    <!-- Header -->
    <header class="control-header">
        <div class="control-header__inner">
            <div class="control-header__brand">
                <div class="control-header__icon">
                    <i class="bi bi-buildings"></i>
                </div>
                <div>
                    <h1 class="control-header__title">Panel de Conserjes</h1>
                    <span class="control-header__sub">Monitorización y control de aulas</span>
                </div>
            </div>
            <div class="control-header__actions">
                <span id="device-count" class="device-badge">
                    <i class="bi bi-cpu"></i> <span id="device-count-text">0 dispositivos</span>
                </span>
                <span id="ws-status" class="ws-badge ws-badge--off">
                    <i class="bi bi-circle-fill"></i> Desconectado
                </span>
                <button id="btn-actualizar" class="btn-action">
                    <i class="bi bi-arrow-clockwise"></i> Actualizar
                </button>
                <button id="btn-logout" class="btn-action btn-action--danger">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </div>
        </div>
    </header>

    <!-- Main Panel -->
    <main class="panel-content">
        <div id="panel" class="rooms-grid">
            <div class="panel-loading">
                <div class="spinner"></div>
                <p>Conectando con el servidor…</p>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', path='js/conserjes.js') }}"></script>
</body>
</html>
