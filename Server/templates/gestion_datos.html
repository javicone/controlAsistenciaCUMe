<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Datos - Sistema de Control de Asistencia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/gestion_datos.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Overlay (para móviles) -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon"><i class="bi bi-database-fill"></i></span>
                    <span class="logo-text">Gestor de Datos</span>
                </div>
                <p class="logo-subtitle">Control de Asistencia CUMe</p>
            </div>
            
            <nav class="sidebar-nav">
                <button class="nav-item active" data-section="usuarios">
                    <span class="nav-icon"><i class="bi bi-people-fill"></i></span>
                    <span class="nav-label">Usuarios</span>
                    <span class="nav-badge" id="badge-usuarios">0</span>
                </button>
                <button class="nav-item" data-section="aulas">
                    <span class="nav-icon"><i class="bi bi-building"></i></span>
                    <span class="nav-label">Aulas</span>
                    <span class="nav-badge" id="badge-aulas">0</span>
                </button>
                <button class="nav-item" data-section="clases">
                    <span class="nav-icon"><i class="bi bi-journal-bookmark-fill"></i></span>
                    <span class="nav-label">Clases</span>
                    <span class="nav-badge" id="badge-clases">0</span>
                </button>
                <button class="nav-item" data-section="asistencias">
                    <span class="nav-icon"><i class="bi bi-clipboard-check-fill"></i></span>
                    <span class="nav-label">Asistencias</span>
                    <span class="nav-badge" id="badge-asistencias">0</span>
                </button>
            </nav>
            
            <div class="sidebar-footer">
                <a href="/adminPanel" class="btn-back-sidebar">
                    <i class="bi bi-arrow-left"></i> Volver al panel principal
                </a>
                <button id="btn-logout" class="btn-logout-sidebar">
                    <i class="bi bi-box-arrow-right"></i> Cerrar Sesion
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="content-header">
                <div class="header-left">
                    <button class="btn-menu-toggle" id="btn-menu-toggle">
                        <i class="bi bi-list"></i>
                    </button>
                    <div>
                        <h1 id="section-title">Gestión de Usuarios</h1>
                        <p class="header-subtitle" id="section-subtitle">Administra los usuarios del sistema</p>
                    </div>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <span class="search-icon"><i class="bi bi-search"></i></span>
                        <input type="text" id="search-input" placeholder="Buscar...">
                    </div>
                    <button class="btn-add" id="btn-add-new">
                        <i class="bi bi-plus-lg"></i> Anadir Nuevo
                    </button>
                </div>
            </header>

            <!-- Stats Cards -->
            <div class="stats-row" id="stats-row">
                <!-- Se llenará dinámicamente -->
            </div>

            <!-- Data Table Section -->
            <section class="table-section">
                <div class="table-container">
                    <table class="data-table" id="data-table">
                        <thead id="table-head">
                            <!-- Headers dinámicos -->
                        </thead>
                        <tbody id="table-body">
                            <!-- Datos dinámicos -->
                        </tbody>
                    </table>
                </div>
                
                <!-- Empty State -->
                <div class="empty-state" id="empty-state" style="display: none;">
                    <div class="empty-icon"><i class="bi bi-inbox"></i></div>
                    <h3>No hay datos</h3>
                    <p>Aun no se han registrado elementos en esta seccion</p>
                </div>

                <!-- Loading State -->
                <div class="loading-state" id="loading-state" style="display: none;">
                    <div class="spinner"></div>
                    <p>Cargando datos...</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal para Crear/Editar -->
    <div id="modal-form" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="modal-title">Añadir Elemento</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <form id="entity-form" class="modal-form">
                <div id="form-fields">
                    <!-- Campos dinamicos segun la entidad -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-delete-modal" id="btn-delete-from-modal" style="display: none;">
                        <i class="bi bi-trash3"></i> Eliminar
                    </button>
                    <div class="modal-footer-right">
                        <button type="button" class="btn-cancel" id="btn-cancel-form">Cancelar</button>
                        <button type="submit" class="btn-save">
                            <i class="bi bi-check-lg"></i>
                            Guardar
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Confirmacion para Eliminar -->
    <div id="modal-confirm" class="modal-overlay" style="display: none;">
        <div class="modal-container modal-confirm">
            <div class="confirm-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
            <h3>Eliminar este registro?</h3>
            <p id="confirm-message">Esta accion no se puede deshacer.</p>
            <div class="confirm-buttons">
                <button class="btn-cancel" id="btn-cancel-delete">Cancelar</button>
                <button class="btn-delete" id="btn-confirm-delete">
                    <i class="bi bi-trash3"></i> Eliminar
                </button>
            </div>
        </div>
    </div>

    <!-- Panel de Lista Filtrada -->
    <div id="filter-panel" class="filter-panel" style="display: none;">
        <div class="filter-panel-header">
            <h3 id="filter-panel-title">Lista</h3>
            <button class="filter-panel-close" id="filter-panel-close"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="filter-panel-content" id="filter-panel-list">
            <!-- Lista dinamica -->
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>

    <script src="{{ url_for('static', path='js/gestion_datos.js') }}"></script>
</body>
</html>
