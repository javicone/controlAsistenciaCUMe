<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Universidad de Extremadura</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
</head>
<body>
    <div class="login-container">
        <img src="https://www.unex.es/wp-content/themes/uex/images/logos/logo-UEx.webp" alt="Logotipo UEX" class="login-logo">
        
        <h2>Acceso a Control de Asistencia</h2>
        <p>Dashboard de aulas</p>
        
        <div class="form-group">
            <label for="correo" class="visually-hidden">Correo Electrónico</label>
            <input type="email" id="correo" class="form-control" placeholder="Correo Electrónico" required>
        </div>

        <div class="form-group">
            <label for="password" class="visually-hidden">Contraseña</label>
            <input type="password" id="password" class="form-control" placeholder="Contraseña" required>
        </div>

        <button type="button" class="btn-login" onclick="login()">Entrar</button>
        
        <p id="error-message"></p>
    </div>

    <script src="{{ url_for('static', path='js/login.js') }}"></script>
</body>
</html>
